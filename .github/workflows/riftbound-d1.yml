name: Riftbound data -> D1

# Validates the Riftbound data files (calendar, news, rules) on every PR and push; on main it also loads the
# public calendar rows and the news into the Cloudflare D1 database "riftbound". The site itself is rebuilt by Workers Builds on the same push.
on:
  push:
    branches: [main]
    paths:
      - src/data/riftbound-calendar.json
      - src/data/riftbound-news.json
      - src/data/riftbound-rules.json
      - scripts/riftbound-d1.mjs
      - .github/workflows/riftbound-d1.yml
  pull_request:
    paths:
      - src/data/riftbound-calendar.json
      - src/data/riftbound-news.json
      - src/data/riftbound-rules.json
      - scripts/riftbound-d1.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate
        run: node scripts/riftbound-d1.mjs --check
      - name: Load D1
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/riftbound-d1.mjs
